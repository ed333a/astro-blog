# 允许这些依赖运行 postinstall 脚本 (pnpm 默认会阻止依赖的构建脚本)。
# cn-font-split 的二进制 (.so/.dll) 不随 npm 包分发, 靠 postinstall 从 GitHub 下载对应平台的文件。
allowBuilds:
  cn-font-split: true
  esbuild: false
  koffi: false
  protobufjs: false

# cloudflare 使用的是 pnpm10, 上面的 allowBuilds 适用于 pnpm11+
onlyBuiltDependencies:
  - cn-font-split

minimumReleaseAgeExclude:
  - astro@7.3.5
